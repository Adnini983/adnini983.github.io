# 站点配置

# 导入主题
theme: jekyll-theme-chirpy

# 网页语言 › http://www.lingoes.net/en/translator/langcode.htm
# 如果该值与文件夹 `_data/locales` 中的某个文件名相同，那么界面文案也会随之切换为对应语言；
# 否则界面文案将使用默认值 'en'。
lang: zh-CN

# 修改为你的时区 › https://zones.arilyn.cc
timezone: Asia/Shanghai

# jekyll-seo-tag 设置 › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: Adnini983 # 网站主标题

tagline: 内容随缘更新 # 显示为副标题

description: >- # 用于 SEO 元数据与 Atom 订阅
  记录 3DS 开发机破解（安装自制固件 boot9strap）的完整指南，以及我的技术笔记。

# 填写你网站的协议与域名。
# 例如 'https://username.github.io'，注意末尾不要带 '/'。
url: "https://adnini983.github.io"

github:
  username: Adnini983 # 修改为你的 GitHub 用户名

twitter:
  username: # 修改为你的 Twitter 用户名

social:
  # 修改为你的全名。
  # 它将作为文章的默认作者，以及页脚中的版权所有者显示。
  name: Adnini983
  email: # 修改为你的邮箱地址
  fediverse_handle: # 填写你的 fediverse 账号。例如 "@username@domain.com"
  links:
    # 第一个元素作为版权所有者的链接
    - https://github.com/Adnini983 # 修改为你的 GitHub 主页
    # 取消注释可添加更多社交链接
    # - https://www.facebook.com/username
    # - https://www.linkedin.com/in/username

# 站点验证设置
webmaster_verifications:
  google: # 填写你的 Google 验证码
  bing: # 填写你的 Bing 验证码
  alexa: # 填写你的 Alexa 验证码
  yandex: # 填写你的 Yandex 验证码
  baidu: # 填写你的百度验证码
  facebook: # 填写你的 Facebook 验证码

# ↑ --------------------------
# `jekyll-seo-tag` 设置结束

# 网站统计设置
analytics:
  google:
    id: # 填写你的 Google Analytics ID
  goatcounter:
    id: # 填写你的 GoatCounter ID
  umami:
    id: # 填写你的 Umami ID
    domain: # 填写你的 Umami 域名
  matomo:
    id: # 填写你的 Matomo ID
    domain: # 填写你的 Matomo 域名
  cloudflare:
    id: # 填写你的 Cloudflare Web Analytics token
  fathom:
    id: # 填写你的 Fathom Site ID

# 浏览量设置
pageviews:
  provider: # 目前仅支持 'goatcounter'

# 配色方案偏好设置。
#
# 注意：留空将默认跟随系统的配色偏好，
# 并在侧边栏左下角提供一个明暗主题切换按钮。
#
# 可选值：
#
#     light — 使用浅色配色方案
#     dark — 使用深色配色方案
#
theme_mode: # [light | dark]

# 媒体资源的 CDN 端点。
# 注意：一旦赋值，CDN 地址将会被添加到所有以 '/' 开头的媒体资源
# （站点头像、文章图片、音频和视频文件）的路径之前。
#
# 例如 'https://cdn.com'
# 注意：本站所有文章图片均为本地资源，故将 CDN 留空，避免图片被错误地指向外部 CDN。
cdn: ""

# 侧边栏头像，支持本地或 CORS 资源
# 留空则侧边栏不显示头像。
avatar: ""

# 用于 SEO `og:image` 元标签的全站社交预览图 URL。
# 可通过文章 front matter 中的自定义 `page.image` 覆盖。
social_preview_image: # 字符串，本地或 CORS 资源

# 布尔类型，文章目录（TOC）的全局开关。
toc: true

actions:
  # 是否在每篇文章页面上显示“编辑此文”按钮以鼓励贡献。
  edit_post:
    enabled: false # 设为 true 以显示“编辑此文”按钮。
    url: "" # 仓库基础 URL，例如 https://github.com/cotes2020/jekyll-theme-chirpy/edit/master
    # 使用动态或静态 URL 作为编辑链接。
    # 若 `static_url` 为 false，文章路径会追加到上面的 `url` 之后，构成最终的编辑链接。
    # 若设为 true，则 URL 保持不变，即每篇文章共用同一个编辑链接。
    static_url: false # [ true | false ]

comments:
  # 文章评论系统的全局开关。留空表示禁用。
  provider: # [disqus | utterances | giscus]
  # 各评论系统选项如下：
  disqus:
    shortname: # 填写 Disqus shortname。› https://help.disqus.com/en/articles/1717111-what-s-a-shortname
  # utterances 设置 › https://utteranc.es/
  utterances:
    repo: # <gh-用户名>/<仓库>
    issue_term: # < url | pathname | title | ...>
  # Giscus 选项 › https://giscus.app
  giscus:
    repo: # <gh-用户名>/<仓库>
    repo_id:
    category:
    category_id:
    mapping: # 可选，默认为 'pathname'
    strict: # 可选，默认为 '0'
    input_position: # 可选，默认为 'bottom'
    lang: # 可选，默认为 `site.lang` 的值
    reactions_enabled: # 可选，默认为 `1`

# 自托管静态资源，可选 › https://github.com/cotes2020/chirpy-static-assets
assets:
  self_host:
    enabled: # 布尔类型，留空表示 false
    # 指定 Jekyll 环境，留空表示两种环境都生效
    # 仅在 `assets.self_host.enabled` 为 'true' 时生效
    env: # [development | production]

pwa:
  enabled: true # PWA 功能（可安装）选项
  cache:
    enabled: true # PWA 离线缓存选项
    # 此处定义的路径将从 PWA 缓存中排除。
    # 通常其值为另一个与当前网站共享同一域名网站的 `baseurl`。
    deny_paths:
      # - "/example"  # 匹配 `<SITE_URL>/example/*` 的 URL 将不会被 PWA 缓存

paginate: 10

# 你网站的基础 URL
baseurl: ""

# ------------ 以下选项不建议修改 ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge 选项 › https://github.com/jneen/rouge#full-options
    css_class: highlight
    # default_lang: console
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" # 空字符串表示项目中的所有文件
      type: posts
    values:
      layout: post
      comments: true # 在文章中启用评论。
      toc: true # 在文章中显示 TOC 目录列。
      # 除非你有足够的把握更新本项目中所有其他文章链接，
      # 否则请勿修改以下参数。
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # 参见 `site.collections`
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
