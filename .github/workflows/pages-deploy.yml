name: "构建并部署"

on:
  push:
    branches:
      - main
      - master
    # 注意：这里刻意不配置 paths-ignore。
    # 本仓库同时存在 GitHub 自带的旧版构建器（pages-build-deployment，走「分支部署」）。
    # 一旦某次 push 只改了 README/.gitignore/LICENSE 而被 paths-ignore 跳过，
    # 旧版构建器就会用 .nojekyll 把仓库原文直接发布，导致站点变成未渲染的源文件。
    # 因此每次 push 都必须由本工作流重新发布构建产物。

  # 允许从 Actions 标签页手动运行此工作流
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 允许一次并发部署
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
          # 如果使用 Chirpy Starter 的 'assets' git 子模块，请取消上面的注释

      - name: 配置 Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: 配置 Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: 构建站点
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: 测试站点
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/,/^http:\/\/cloud\.189\.cn/,/^http:\/\/soundhax\.com/"

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
